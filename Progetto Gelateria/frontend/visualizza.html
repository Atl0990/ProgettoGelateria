<!DOCTYPE html>
<html>
<body>

<h2>Lista Gusti</h2>
<button onclick="carica()">Carica</button>
<table border="1" id="tab"></table>

<script>
function carica(){
 fetch("http://localhost:7000/gusti")
 .then(r=>r.json())
 .then(d=>{
   let t=document.getElementById("tab");
   t.innerHTML="";
   d.forEach(g=>{
     t.innerHTML+="<tr><td>"+g.id+"</td><td>"+g.nome+"</td><td>"+g.prezzo+"</td></tr>";
   });
 });
}
</script>

</body>
</html>
