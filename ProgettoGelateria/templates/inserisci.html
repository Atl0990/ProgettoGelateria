<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiungi Gusto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>SchizzaLotto</h1>
        <nav><a href="/">Dashboard</a><a href="/lavora_con_noi">Lavora con noi</a></nav>
    </header>
    <div class="main-wrapper" style="display: block; max-width: 600px; margin: 0 auto;">
        <div class="card">
            <h2>Aggiungi una nuova delizia</h2>
            <form action="/api/aggiungi_gusto" method="POST">
                <label>Nome Gusto:</label>
                <input type="text" name="nome" placeholder="es. Nocciola IGP" required>
                <label>Quantità in Kg:</label>
                <input type="number" step="0.1" name="quantita_kg" placeholder="es. 5.5" required>
                <button type="submit" style="width: 100%;">Salva nel Database</button>
            </form>
        </div>
    </div>
</body>
</html>
